<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .SiteTitle }}</title>
    {{ if .Description }}
    <meta name="description" content="{{ .Description }}">
    {{ end }}
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <header>
      <nav>
  {{ range .Navigation }}
  <a href="{{ .URL }}">{{ .Title }}</a>
  {{ end }}
</nav>
    </header>

   <main>
  {{ .Content }}

  {{ if .Posts }}
  <ul>
    {{ range .Posts }}
    <li>
      <a href="{{ .URL }}">{{ .Title }}</a>
      <p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .DateText }}</time></p>
      {{ if .Description }}
      <p>{{ .Description }}</p>
      {{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</main>

    <footer>
      <p>Built with ssg</p>
    </footer>
    <script>
  const eventSource = new EventSource("/__reload");

  eventSource.onmessage = () => {
    window.location.reload();
  };
</script>
  </body>
</html>
